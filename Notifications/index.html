<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الإشعارات - تجربة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #f0f2f5;
            padding: 30px;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #1a1a1a;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .unread-badge {
            background: #e74c3c;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notification {
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-right: 5px solid #3498db;
            transition: 0.2s;
        }

        .notification.unread {
            border-right-color: #e74c3c;
            background: #fff8f8;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .notification-title {
            font-weight: bold;
            font-size: 16px;
        }

        .notification-time {
            font-size: 12px;
            color: #888;
        }

        .notification-message {
            color: #555;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .notification-actions {
            display: flex;
            gap: 8px;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #888;
            background: white;
            border-radius: 12px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>نظام الإشعارات</h1>

        <div class="header">
            <div>
                <strong>الإشعارات غير المقروءة:</strong>
                <span class="unread-badge" id="unreadCount">0</span>
            </div>
            <div>
                <button class="btn btn-primary" onclick="loadNotifications()">تحديث</button>
                <button class="btn btn-success" onclick="markAllAsRead()">تعليم الكل كمقروء</button>
            </div>
        </div>

        <div id="notifications" class="notifications-list">
            <div class="loading">جاري التحميل...</div>
        </div>
    </div>

    <script>
        // غيّر الرابط ده حسب عنوان الـ Backend عندك
        const API_URL = "http://localhost:8000/notifications";

        // لو عندك Token حطه هنا
        const TOKEN = "";  // مثال: "Bearer eyJhbGciOi..."

        function getHeaders() {
            const headers = {
                "Content-Type": "application/json"
            };
            if (TOKEN) {
                headers["Authorization"] = TOKEN;
            }
            return headers;
        }

        async function loadNotifications() {
            const container = document.getElementById("notifications");
            container.innerHTML = `<div class="loading">جاري التحميل...</div>`;

            try {
                const response = await fetch(API_URL, {
                    headers: getHeaders()
                });

                if (!response.ok) throw new Error("فشل في جلب الإشعارات");

                const data = await response.json();
                renderNotifications(data);
                loadUnreadCount();
            } catch (error) {
                container.innerHTML = `<div class="empty">حدث خطأ: ${error.message}</div>`;
            }
        }

        async function loadUnreadCount() {
            try {
                const response = await fetch(`${API_URL}/unread-count`, {
                    headers: getHeaders()
                });
                const data = await response.json();
                document.getElementById("unreadCount").textContent = data || 0;
            } catch (error) {
                console.error("خطأ في جلب عدد الإشعارات:", error);
            }
        }

        function renderNotifications(notifications) {
            const container = document.getElementById("notifications");

            if (!notifications || notifications.length === 0) {
                container.innerHTML = `<div class="empty">لا توجد إشعارات حاليًا</div>`;
                return;
            }

            container.innerHTML = notifications.map(notif => `
                <div class="notification ${notif.is_read ? '' : 'unread'}">
                    <div class="notification-header">
                        <div class="notification-title">${notif.title}</div>
                        <div class="notification-time">${formatDate(notif.created_at)}</div>
                    </div>
                    <div class="notification-message">${notif.message}</div>
                    <div class="notification-actions">
                        ${!notif.is_read ? `
                            <button class="btn btn-success" onclick="markAsRead('${notif.id}')">
                                تعليم كمقروء
                            </button>
                        ` : ''}
                        <button class="btn btn-danger" onclick="deleteNotification('${notif.id}')">
                            حذف
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function markAsRead(id) {
            try {
                const response = await fetch(`${API_URL}/${id}/read`, {
                    method: "PUT",
                    headers: getHeaders()
                });

                if (response.ok) {
                    loadNotifications();
                }
            } catch (error) {
                alert("حدث خطأ أثناء تحديث الإشعار");
            }
        }

        async function markAllAsRead() {
            try {
                const response = await fetch(`${API_URL}/read-all`, {
                    method: "PUT",
                    headers: getHeaders()
                });

                if (response.ok) {
                    loadNotifications();
                }
            } catch (error) {
                alert("حدث خطأ");
            }
        }

        async function deleteNotification(id) {
            if (!confirm("هل أنت متأكد من حذف هذا الإشعار؟")) return;

            try {
                const response = await fetch(`${API_URL}/delete/${id}`, {
                    method: "DELETE",
                    headers: getHeaders()
                });

                if (response.ok) {
                    loadNotifications();
                }
            } catch (error) {
                alert("حدث خطأ أثناء الحذف");
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString("ar-EG");
        }

        // تحميل الإشعارات عند فتح الصفحة
        loadNotifications();

        // تحديث تلقائي كل 30 ثانية (اختياري)
        setInterval(loadNotifications, 30000);
    </script>
</body>
</html>
